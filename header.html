        <div id="logo-header">
            <i></i>
            <h1>D<span id="special1">a</span><span id="special2">s</span>h</h1>
        </div>

        <nav id="navigation-header">
            <div class="link-navigation-header" id="link-special">

    <main>
        <section class="section-option">
            <div class="section-option-left">
                <p>MODES : </p>

                    <select id="time">
                        <option value="30s">30s</option>

                        <option value="120s">120s</option>
                    </select>
                </div>

                <div class="section-option-mode">
                    <label for="word">Mots</label>

                    <select id="word">
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>

                <button>Citations</button>
            </div>

            <div class="section-option-right">
                <p>DIFFICULTE : </p>
                    <button id="level-actual">Amateur</button>
                    <button>Intermédiaire</button>
                    <button>Hardcore</button>
