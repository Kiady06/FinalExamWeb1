<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash</title>
    <link rel="icon" type="image/svg+xml" href="assets/favIcon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="setting.css">
</head>

<body>
    <header>
        <div id="logo-header">
            <h1>Da<span id="special2">s</span>h</h1>
        </div>

         <nav id="navigation-header">
            <div class="link-navigation-header">
                <i class="fa-regular fa-keyboard"></i>
                <a href="header.html">Test</a>
            </div>

            <div class="link-navigation-header">
                <i class="fa-regular fa-keyboard"></i>
                <a href="result.html">Résultats</a>
            </div>

            <div class="link-navigation-header">
                <i class="fa-solid fa-trophy"></i>
                <a href="leadboard.html">Leaderboard</a>
            </div>

            <div class="link-navigation-header">
                <i class="fa-regular fa-user"></i>
                <a href="profil.html">Profil</a>
            </div>

            <div class="link-navigation-header" id="link-special">
                <i class="fa-solid fa-gear"></i>
                <a href="setting.html">Réglages</a>
            </div>
        </nav>

        <div id="user-header">
            <img src="assets/user.jpg" alt="Impossible de charger l'image !">
            <p>NovaStrike</p>
        </div>
    </header>

    <main>
        <section class="section-left">
            <div class="section-left-title">
                <i class="fa-regular fa-keyboard"></i>
                <h2>Thèmes et style d'interface</h2>
            </div>

            <div class="section-left-theme1">
                <div class="active-theme">
                    <div class="color-theme"> <!-- Les couleurs du thèmes -->
                        <div class="color-theme-ring1"></div>
                        <div class="color-theme-ring2"></div>
                    </div>

                    <p>Glitch Core ( Défaut sombre )</p>
                </div>

                <p class="active-theme-statut">ACTIF</p>
            </div>

            <div class="section-left-theme2">
                <div class="not-active-theme">
                    <div class="color-theme"> <!-- Les couleurs du thèmes -->
                        <div class="color-theme-ring3"></div>
                        <div class="color-theme-ring4"></div>
                    </div>

                    <p>Cyber-Neon ( Air Techno )</p>
                </div>
            </div>
        </section>

        <section class="section-right">
            <div class="section-right-header">
                <i class="fa-regular fa-keyboard"></i>
                <h2>Son & Typographie</h2>
            </div>

            <div class="section-right-top">
                <div class="section-right-top1">
                    <div class="section-text">
                        <p>Sons mécaniques de touche (SFX)</p>
                        <p id="text-special" >Simule le son de switchs bleus à la frappe</p>
                    </div>

                    <label class="section-switch">
                        <input type="checkbox">
                        <span class="switch-button"></span>
                    </label>
                    <!-- Je sais pas le nom du truc à mettre ici mais, le truc de switch là -->
                </div>

                <div class="section-right-top2">
                    <p>Police Monospace préférée</p>

                    <div class="section-button">
                        <button id="button-text-special">JetBrains Mono</button>
                        <button>Fira Code</button>
                    </div>
                </div>
            </div>

            <button id="section-right-bottom">Sauvegarder les préférences</button>
        </section>
    </main>
</body>
</html>
